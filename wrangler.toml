name = "the-cyber-grimoire"
main = "src/worker/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "the-cyber-grimoire"
database_id = "b400061c-084f-4f40-b0cc-9e27d5d287f4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "the-cyber-grimoire-media"

[vars]
COOKIE_SECURE = "true"
